name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the validation suite
        env:
          PYTHONPATH: api
        run: python -m unittest discover -s api/tests -v

  api:
    name: API imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install service dependencies
        run: pip install -r requirements.txt
      - name: Import the FastAPI app
        run: python -c "import sys; sys.path.insert(0, 'api'); import index; assert index.app.title"
